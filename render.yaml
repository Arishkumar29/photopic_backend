services:
  - type: web
    name: photopic-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # AuraFace needs ~450 MB RAM; the 512 MB free plan is too tight
    region: oregon
    healthCheckPath: /api/health
    disk:                    # keeps events, face index and analytics across deploys
      name: photopic-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: MONGODB_URI     # optional: store events in MongoDB Atlas instead of the disk
        sync: false
